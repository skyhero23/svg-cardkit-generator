<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardKit 3D Studio - Generador de Model Kits y Letras para Impresión 3D</title>
    <meta name="description" content="Generador de CardKits para impresión 3D: crea tarjetas con letras y archivos SVG con conectores y marcos personalizados. Exporta en STL listo para imprimir.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0c0e14',
                        panel: '#151822',
                        card: '#1d212f',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Amplio catálogo tipográfico -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
